<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KUFGEM InfoScreen OS</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#0b1423;color:#e9f1ff}header{padding:20px 28px;background:#17263e;display:flex;align-items:center;justify-content:space-between}h1{margin:0;font-size:22px}main{padding:24px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px}#stage{position:relative;aspect-ratio:16/9;background:#101b2d;border:1px solid #324b6a;border-radius:16px;overflow:hidden;touch-action:none}.widget{position:absolute;border:1px solid #77a4d1;background:#ffffff15;padding:12px;border-radius:10px;cursor:move;user-select:none;overflow:hidden}.widget.active{outline:2px solid #58b4ff}aside{background:#17263e;padding:20px;border-radius:16px}label{display:block;margin:11px 0 5px;font-size:13px;color:#b6c8e0}input,select,button{width:100%;border-radius:8px;border:1px solid #4d6986;padding:9px;background:#263b57;color:white}button{background:#176aae;cursor:pointer;margin-top:12px}button:hover{background:#2588cf}.sub{font-size:13px;color:#9db6d0}#editor{max-height:48vh;overflow:auto}@media(max-width:800px){main{grid-template-columns:1fr}}
</style></head><body><header><h1>KUFGEM <span style="color:#58b4ff">InfoScreen OS</span></h1><span id="status" class="sub">Verbinden …</span></header><main><section><div id="stage"></div><p class="sub">Widgets verschieben und anschließend speichern. Die Anzeige aktualisiert sich automatisch.</p></section><aside><div id="loginPanel"><label>Passwort</label><input id="password" type="password" autocomplete="current-password" placeholder="Passwort eingeben"><button id="login">Anmelden</button><p id="feedbackLogin" class="sub"></p></div><div id="controls" hidden><button id="logout" type="button">Abmelden</button><label>Titel</label><input id="title"><label>Hintergrundfarbe</label><input id="background" type="color"><label>Hintergrundbild (PNG/JPEG, max. 4 MB)</label><input id="image" type="file" accept="image/png,image/jpeg"><button id="upload">Bild hochladen</button><label>Widget hinzufügen</label><select id="kind"><option value="clock">Uhr</option><option value="message">Mitteilung</option><option value="weather">Wetter (Platzhalter)</option><option value="departures">Bahn (Platzhalter)</option><option value="traffic">Verkehr (Platzhalter)</option></select><button id="add">Widget hinzufügen</button><hr><h3>Widget-Einstellungen</h3><div id="editor">Widget anklicken</div><button id="save">Layout speichern</button><p id="feedback" class="sub"></p></div></aside></main><script defer src="/app.js"></script></body></html>
