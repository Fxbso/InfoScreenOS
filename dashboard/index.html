<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KUFGEM InfoScreen OS</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#0b1423;color:#e9f1ff}header{padding:20px 28px;background:#17263e;display:flex;align-items:center;justify-content:space-between}h1{margin:0;font-size:22px}main{padding:24px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px}#stage{position:relative;aspect-ratio:16/9;background:#101b2d;border:1px solid #324b6a;border-radius:16px;overflow:hidden;touch-action:none}.widget{position:absolute;border:1px solid #77a4d1;background:#ffffff15;padding:12px;border-radius:10px;cursor:move;user-select:none;overflow:hidden}.widget.active{outline:2px solid #58b4ff}aside{background:#17263e;padding:20px;border-radius:16px}label{display:block;margin:11px 0 5px;font-size:13px;color:#b6c8e0}input,select,button{width:100%;border-radius:8px;border:1px solid #4d6986;padding:9px;background:#263b57;color:white}button{background:#176aae;cursor:pointer;margin-top:12px}button:hover{background:#2588cf}.sub{font-size:13px;color:#9db6d0}#editor{max-height:48vh;overflow:auto}@media(max-width:800px){main{grid-template-columns:1fr}}
</style></head><body><header><h1>KUFGEM <span style="color:#58b4ff">InfoScreen OS</span></h1><span id="status" class="sub">Verbinden …</span></header><main><section><div id="stage"></div><p class="sub">Widgets verschieben und anschließend speichern. Die Anzeige aktualisiert sich automatisch.</p></section><aside><label>Admin-Token (wird nicht gespeichert)</label><input id="token" type="password" autocomplete="off" placeholder="Token eingeben"><button id="login">Dashboard öffnen</button><div id="controls" hidden><label>Titel</label><input id="title"><label>Hintergrundfarbe</label><input id="background" type="color"><label>Widget hinzufügen</label><select id="kind"><option value="clock">Uhr</option><option value="message">Mitteilung</option><option value="weather">Wetter (Platzhalter)</option><option value="departures">Bahn (Platzhalter)</option><option value="traffic">Verkehr (Platzhalter)</option></select><button id="add">Widget hinzufügen</button><hr><h3>Widget-Einstellungen</h3><div id="editor">Widget anklicken</div><button id="save">Layout speichern</button><p id="feedback" class="sub"></p></div></aside></main><script>
const $=id=>document.getElementById(id);let token="",config=null,selected=null;
function hdr(){return {"Authorization":"Bearer "+token,"Content-Type":"application/json"}}
function render(){let stage=$("stage");stage.innerHTML="";stage.style.background=config.background;$("title").value=config.title;$("background").value=/^#[0-9a-f]{6}$/i.test(config.background)?config.background:"#101b2d";
for(const w of config.widgets){let el=document.createElement("div");el.className="widget"+(selected===w.id?" active":"");Object.assign(el.style,{left:w.x+"%",top:w.y+"%",width:w.w+"%",height:w.h+"%",color:w.color||"#ffffff"});el.textContent=w.type==="message"?(w.text||"Mitteilung"):({"clock":"Uhr","weather":"Wetter","traffic":"Verkehr","departures":"Abfahrten"}[w.type]||w.type);
el.onpointerdown=e=>{selected=w.id;renderEditor();const ox=w.x,oy=w.y,sx=e.clientX,sy=e.clientY,rect=stage.getBoundingClientRect();el.setPointerCapture(e.pointerId);el.classList.add("active");for(const other of stage.children)if(other!==el)other.classList.remove("active");const move=ev=>{w.x=Math.round(Math.max(0,Math.min(100-w.w,ox+100*(ev.clientX-sx)/rect.width)));w.y=Math.round(Math.max(0,Math.min(100-w.h,oy+100*(ev.clientY-sy)/rect.height)));el.style.left=w.x+"%";el.style.top=w.y+"%";renderEditor()};el.addEventListener("pointermove",move);el.addEventListener("pointerup",()=>el.removeEventListener("pointermove",move),{once:true})};stage.append(el)}renderEditor()}
function renderEditor(){let box=$("editor");box.innerHTML="";let w=config.widgets.find(x=>x.id===selected);if(!w){box.textContent="Widget anklicken";return}for(const k of ["x","y","w","h","color",...(w.type==="message"?["text"]:[]),...(w.type==="weather"?["location"]:[])]){let label=document.createElement("label");label.textContent=k;let field=document.createElement("input");field.value=w[k]??"";field.type=["x","y","w","h"].includes(k)?"number":"text";field.onchange=()=>{w[k]=field.type==="number"?Math.max(k==="w"||k==="h"?1:0,Math.min(100,Number(field.value))):field.value;render()};box.append(label,field)}let remove=document.createElement("button");remove.textContent="Widget entfernen";remove.onclick=()=>{config.widgets=config.widgets.filter(x=>x.id!==w.id);selected=null;render()};box.append(remove)}
$("login").onclick=async()=>{token=$("token").value;try{const r=await fetch("/api/config",{headers:hdr()});if(!r.ok)throw Error("Token falsch oder API nicht erreichbar");config=await r.json();$("controls").hidden=false;$("status").textContent="Verbunden";render()}catch(e){$("status").textContent=e.message}};
$("add").onclick=()=>{let type=$("kind").value;let w={id:"w-"+Date.now(),type,x:10,y:20,w:35,h:20,color:"#ffffff"};if(type==="message")w.text="Neue Mitteilung";if(type==="weather")w.location="Kufstein";config.widgets.push(w);selected=w.id;render()};
$("title").onchange=e=>config.title=e.target.value;$("background").oninput=e=>{config.background=e.target.value;$("stage").style.background=e.target.value};
$("save").onclick=async()=>{try{const r=await fetch("/api/config",{method:"PUT",headers:hdr(),body:JSON.stringify(config)});if(!r.ok)throw Error(await r.text());$("feedback").textContent="Gespeichert – Änderung wird auf HDMI angezeigt."}catch(e){$("feedback").textContent="Fehler: "+e.message}};
</script></body></html>
