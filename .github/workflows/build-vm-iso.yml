name: Build VirtualBox Live ISO
on:
  workflow_dispatch:
jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install Debian live-build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build dpkg-dev debian-archive-keyring debootstrap ca-certificates gnupg gpgv python3 xorriso isolinux syslinux-common syslinux-utils grub-pc-bin grub-efi-amd64-bin mtools dosfstools squashfs-tools
      - name: Test API
        run: python3 -m unittest discover -s tests
      - name: Static preflight
        run: |
          command -v gpg
          gpg --version
          bash -n vm/build-iso.sh packaging/build-deb.sh
          python3 -m compileall -q backend display tests
          test -f packaging/kufgem-infoscreen-api.service
          test -f packaging/kufgem-infoscreen-display.service
          grep -q -- '--security false' vm/build-iso.sh
          grep -q 'trixie-security' vm/build-iso.sh
          if grep -Eq '^[[:space:]]*(cp|install).*config/packages.chroot' vm/build-iso.sh; then
            echo 'Local Debian packages must not be used in the live ISO build' >&2
            exit 1
          fi
      - name: Build VirtualBox ISO
        run: bash vm/build-iso.sh
      - name: Upload ISO build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KUFGEM-InfoScreenOS-VM-amd64
          path: |
            dist/KUFGEM-InfoScreenOS-VM-amd64.iso
            dist/KUFGEM-InfoScreenOS-VM-amd64.iso.sha256
          retention-days: 7
